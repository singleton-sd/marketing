<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img" aria-label="Singleton SD Content Admin">
  <!--
    Unused by Decap (config.yml points at the CDN PNG). Kept as a local text
    fallback — do not embed external <image href> here; browsers block those
    when the SVG is loaded via <img>.
  -->
  <text
    x="100"
    y="28"
    text-anchor="middle"
    font-family="Open Sauce Sans, ui-sans-serif, system-ui, Segoe UI, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="-0.04em"
    fill="#f5f6f7"
  >
    Singleton SD
  </text>
  <text
    x="100"
    y="52"
    text-anchor="middle"
    font-family="Open Sauce Sans, ui-sans-serif, system-ui, Segoe UI, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="0.02em"
    fill="#b3b7bd"
  >
    Content admin
  </text>
</svg>
