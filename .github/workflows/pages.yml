# Production GitHub Pages deploy on push to main.
# House pattern: singleton-sd/poc-inkads-marketing `.github/workflows/pages.yml`
name: Deploy production GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Shared with preview publish/cleanup so gh-pages writes do not overlap.
concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build + GitHub Pages production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @singleton-sd/marketing run test

      - name: Install Playwright Chromium
        run: pnpm --filter @singleton-sd/marketing exec playwright install --with-deps chromium

      - name: Playwright lead forms
        run: |
          PUBLIC_TURNSTILE_SITE_KEY="${PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}" \
            pnpm --filter @singleton-sd/marketing run build
          pnpm --filter @singleton-sd/marketing run test:e2e
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build production site
        run: pnpm --filter @singleton-sd/marketing... run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_LEADS_API_URL: ${{ vars.PUBLIC_LEADS_API_URL }}

      - name: Smoke marketing tokens
        run: pnpm --filter @singleton-sd/marketing run test:smoke

      - name: Check production asset paths
        run: node scripts/check-pages-asset-paths.mjs apps/marketing/dist /

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: apps/marketing/dist
          clean: true
          clean-exclude: pr-preview
