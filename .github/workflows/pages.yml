# Production GitHub Pages deploy on push to main.
# House pattern: singleton-sd/leasemate-assets `.github/workflows/pages.yml`
#
# Build is unauthenticated (contents: read, no secrets). Deploy checks out
# for JamesIves (needs a git directory), downloads dist, then mints the
# singleton-release App token as its last setup step and deploys with that
# token only — never GITHUB_TOKEN.
name: Deploy production GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Shared with preview publish/cleanup so gh-pages writes do not overlap.
concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build production site
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @singleton-sd/marketing run test

      - name: Install Playwright Chromium
        run: pnpm --filter @singleton-sd/marketing exec playwright install --with-deps chromium

      - name: Playwright lead forms
        run: |
          PUBLIC_TURNSTILE_SITE_KEY="${PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}" \
            pnpm --filter @singleton-sd/marketing run build
          pnpm --filter @singleton-sd/marketing run test:e2e
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build production site
        run: pnpm --filter @singleton-sd/marketing... run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_LEADS_API_URL: ${{ vars.PUBLIC_LEADS_API_URL }}

      - name: Smoke marketing tokens
        run: pnpm --filter @singleton-sd/marketing run test:smoke

      - name: Check production asset paths
        run: node scripts/check-pages-asset-paths.mjs apps/marketing/dist /

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: apps/marketing/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy production GitHub Pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download production dist
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: apps/marketing/dist

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: marketing
          permission-contents: write

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          folder: apps/marketing/dist
          clean: true
          clean-exclude: pr-preview
