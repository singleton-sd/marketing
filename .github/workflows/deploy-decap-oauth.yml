# Decap GitHub OAuth proxy — Azure Functions on ssd-mkt-plan-prod-ae.
name: Deploy Decap OAuth (Function)

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing-oauth/**'
      - 'infra/decap-oauth.bicep'
      - 'scripts/deploy-decap-oauth.ps1'
      - '.github/workflows/deploy-decap-oauth.yml'
  workflow_dispatch:

concurrency:
  group: deploy-decap-oauth-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-ssd-marketing
  AZURE_FUNCTIONAPP_NAME: ssd-mkt-decap-oauth-prod-ae
  AZURE_KEY_VAULT: ssd-global-kv-prod-ae

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build + Decap OAuth Function
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test marketing-oauth
        run: pnpm --filter @singleton-sd/marketing-oauth run test

      - name: Check OIDC + client id
        id: cfg
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping Decap OAuth deploy."
          elif [ -z "${{ vars.DECAP_OAUTH_CLIENT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DECAP_OAUTH_CLIENT_ID Variable not set."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.cfg.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Assert KV secret exists
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          az keyvault secret show \
            --vault-name "$AZURE_KEY_VAULT" \
            --name github-decap-oauth-client-secret \
            --query name -o tsv >/dev/null

      - name: Resolve SWA hostname for ORIGINS
        id: origins
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          host=$(az staticwebapp show -g rg-ssd-marketing -n ssd-mkt-prod-ae --query defaultHostname -o tsv)
          prefix=$(echo "$host" | cut -d. -f1)
          echo "value=singletonsd.com,www.singletonsd.com,${prefix}*.azurestaticapps.net,localhost:4321" >> "$GITHUB_OUTPUT"

      - name: Deploy Function App infra
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/decap-oauth.bicep \
            --parameters oauthClientId="${{ vars.DECAP_OAUTH_CLIENT_ID }}" \
              origins="${{ steps.origins.outputs.value }}" \
            --name "decap-oauth-${GITHUB_RUN_ID}"

      - name: Stage zip
        if: steps.cfg.outputs.configured == 'true'
        working-directory: apps/marketing-oauth
        run: |
          set -euo pipefail
          pnpm run build
          STAGE=$(mktemp -d)
          cp host.json package.json "$STAGE/"
          cp -r dist "$STAGE/dist"
          (cd "$STAGE" && npm install --omit=dev --package-lock=false)
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/decap-oauth.zip" .)

      - name: Zip deploy Function App
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --src decap-oauth.zip
