# PR preview on GitHub Pages at /pr-preview/pr-<number>/.
# House pattern: singleton-sd/leasemate-assets `.github/workflows/pages.yml`
# (split read-only build from App-token deploy; this site has no visual-review).
#
# Build runs PR-controlled install/test/build with contents:read and no
# persisted credentials. Publish/cleanup mint the singleton-release App token
# as their last step before rossjrw/pr-preview-action and never fall back to
# GITHUB_TOKEN. Sticky comments keep GITHUB_TOKEN with pull-requests: write.
name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  build:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    name: Build GitHub Pages preview
    concurrency:
      group: preview-build-pr-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      PREVIEW_DIST_NAME: preview-dist-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @singleton-sd/marketing run test

      - name: Install Playwright Chromium
        run: pnpm --filter @singleton-sd/marketing exec playwright install --with-deps chromium

      - name: Playwright lead forms
        run: |
          PUBLIC_TURNSTILE_SITE_KEY="${PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}" \
            pnpm --filter @singleton-sd/marketing run build
          pnpm --filter @singleton-sd/marketing run test:e2e
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build preview site
        run: pnpm --filter @singleton-sd/marketing... run build
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_LEADS_API_URL: ${{ vars.PUBLIC_LEADS_API_URL }}

      - name: Smoke marketing tokens
        run: pnpm --filter @singleton-sd/marketing run test:smoke

      - name: Check preview asset paths
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
        run: node scripts/check-pages-asset-paths.mjs apps/marketing/dist "$PREVIEW_BASE_PATH"

      - name: Upload preview dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PREVIEW_DIST_NAME }}
          path: apps/marketing/dist
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    name: Publish GitHub Pages preview
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    env:
      PREVIEW_DIST_NAME: preview-dist-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download preview dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.PREVIEW_DIST_NAME }}
          path: apps/marketing/dist

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: marketing
          permission-contents: write

      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://www.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

      - name: Retry deploy preview
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://www.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

  comment:
    needs: publish
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    name: Post sticky preview comment
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_URL: https://www.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Post sticky preview comment
        id: preview_comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: marketing-preview
          recreate: true
          message: |
            ## Preview

            🔗 **[Open live preview](${{ env.PREVIEW_URL }})**

            Built with Astro `base` `/pr-preview/pr-${{ env.PR_NUMBER }}/` and published to the `gh-pages` branch (production files are left in place).

            Preview URLs resolve on `www.singletonsd.com` after the GitHub Pages custom-domain cutover. Fork PRs are not published.

            Do **not** sign in to `/admin` while a preview tab is open — previews share the production origin (GitHub Pages path previews cannot use a separate host without DNS/Pages settings changes).

      - name: Retry sticky preview comment
        if: steps.preview_comment.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: marketing-preview
          recreate: true
          message: |
            ## Preview

            🔗 **[Open live preview](${{ env.PREVIEW_URL }})**

            Built with Astro `base` `/pr-preview/pr-${{ env.PR_NUMBER }}/` and published to the `gh-pages` branch (production files are left in place).

            Preview URLs resolve on `www.singletonsd.com` after the GitHub Pages custom-domain cutover. Fork PRs are not published.

            Do **not** sign in to `/admin` while a preview tab is open — previews share the production origin (GitHub Pages path previews cannot use a separate host without DNS/Pages settings changes).

  cleanup:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Remove GitHub Pages preview
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm pull request is still closed
        id: pr_state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('closed', data.state === 'closed' ? 'true' : 'false');
            if (data.state !== 'closed') {
              core.info(`PR is ${data.state}; skipping preview removal.`);
            }

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.pr_state.outputs.closed == 'true'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: marketing
          permission-contents: write

      - name: Remove preview
        id: remove_preview
        if: steps.pr_state.outputs.closed == 'true'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          action: remove
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://www.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

      - name: Retry remove preview
        if: steps.pr_state.outputs.closed == 'true' && steps.remove_preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          action: remove
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://www.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

  hide-comment:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Hide sticky preview comment
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Confirm pull request is still closed
        id: pr_state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('closed', data.state === 'closed' ? 'true' : 'false');
            if (data.state !== 'closed') {
              core.info(`PR is ${data.state}; skipping preview comment hide.`);
            }

      - name: Hide sticky preview comment
        id: hide_comment
        if: steps.pr_state.outputs.closed == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: marketing-preview
          hide: true

      - name: Retry hide sticky preview comment
        if: steps.pr_state.outputs.closed == 'true' && steps.hide_comment.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: marketing-preview
          hide: true
