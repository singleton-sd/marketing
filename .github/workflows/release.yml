# Release Marketing

Manual or tag-driven SemVer release via release-it + conventional changelog.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no tag/push/GitHub release)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-marketing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Release (dry-run)
        if: ${{ inputs.dry_run }}
        run: pnpm release

      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:ci
